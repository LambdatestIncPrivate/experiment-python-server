# Operator-driven release of the LambdaTest amplitude-experiment fork: input
# a package version; this workflow bumps src/amplitude_experiment/version.py
# (setup.py exec-reads it) on main, builds and tests, then commits + tags
# lt-v<version> atomically and chains into release-wheel.yml via
# workflow_call (a tag pushed with GITHUB_TOKEN does not trigger the
# tag-push workflow). lt-v keeps fork tags out of upstream's v* namespace.
name: Release Package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to release, e.g. 1.8.2 (creates tag lt-v1.8.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Validate dispatch ref and version grammar
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::dispatch from main only (got $REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }

      # No credentials persisted: dependency installs and tests run token-free.
      # The push step below authenticates explicitly, only there.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Bump version in src/amplitude_experiment/version.py
        id: gate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="lt-v${VERSION}"
          # gh api (not git ls-remote): the checkout kept no credentials.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"; exit 1
          fi
          CURRENT=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/amplitude_experiment/version.py | head -1)
          if [ "$VERSION" = "$CURRENT" ] || [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::${VERSION} must be strictly greater than current ${CURRENT} (no downgrades)"; exit 1
          fi
          sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"${VERSION}\"/" src/amplitude_experiment/version.py
          grep -q "^__version__ = \"${VERSION}\"\$" src/amplitude_experiment/version.py || { echo "::error::version.py bump failed"; exit 1; }
          git diff --quiet && { echo "::error::${VERSION} is already the current version"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build and verify the proposed wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build --wheel
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          [ "${#WHEELS[@]}" -eq 1 ] || { echo "::error::expected 1 wheel, found ${#WHEELS[@]}"; exit 1; }
          case "$(basename "${WHEELS[0]}")" in
            "amplitude_experiment-${VERSION}-"*) ;;
            *) echo "::error::wheel $(basename "${WHEELS[0]}") does not carry version ${VERSION}"; exit 1 ;;
          esac
          twine check "${WHEELS[0]}"

      # These four integration suites require live Amplitude services and/or
      # credentials; the rest is the repository's hermetic release gate. The
      # files are removed only in the working tree and restored before the
      # release commit, which must contain ONLY the version bump.
      - name: Run package tests
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-dev.txt
          rm \
            tests/evaluation/evaluation_integration_test.py \
            tests/local/client_test.py \
            tests/local/client_eu_test.py \
            tests/remote/client_test.py
          python -m unittest discover -s ./tests -p '*_test.py'
          git checkout -- tests

      - name: Commit bump, tag, push atomically
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.gate.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/amplitude_experiment/version.py
          git commit -m "chore(release): bump amplitude-experiment to ${VERSION}"
          git tag -a "${TAG}" -m "amplitude-experiment ${VERSION} (LambdaTest fork)"
          # --atomic: branch commit and tag land together or not at all.
          # Auth lives only in this step (checkout persisted no credentials);
          # the token is auto-masked in logs.
          git push --atomic "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main "refs/tags/${TAG}"

  publish-wheel:
    needs: bump-and-tag
    permissions:
      contents: read
    uses: ./.github/workflows/release-wheel.yml
    with:
      ref: ${{ needs.bump-and-tag.outputs.tag }}
    # Explicit pass-through — never `secrets: inherit`.
    secrets:
      AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
      AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
