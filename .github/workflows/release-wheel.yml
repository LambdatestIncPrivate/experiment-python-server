# Builds and tests the LambdaTest amplitude-experiment fork and publishes an
# immutable wheel after a release tag/backfill. Public PyPI version 1.8.1 is a
# different artifact, so consumers must use the verified private wheel.
# Upload auth is OIDC through the protected wheels-release environment.
name: Release Wheel to S3

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-wheel.yml'
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing git tag to build (backfill), e.g. v1.1.4'
        required: true

permissions:
  contents: read

concurrency:
  group: release-wheel-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIST_PREFIX: amplitude_experiment
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      wheel: ${{ steps.meta.outputs.wheel }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Resolve and validate tag
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REF_INPUT" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || {
            echo "::error::'$REF_INPUT' is not a release tag"
            exit 1
          }
          echo "tag=$REF_INPUT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.ref.outputs.tag != '' && format('refs/tags/{0}', steps.ref.outputs.tag) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel

      - name: Gate exactly one expected wheel with valid metadata
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          [ "${#WHEELS[@]}" -eq 1 ] || {
            echo "::error::expected 1 wheel, found ${#WHEELS[@]}"
            exit 1
          }
          WHEEL=$(basename "${WHEELS[0]}")
          case "$WHEEL" in
            "${DIST_PREFIX}"-*) ;;
            *) echo "::error::unexpected wheel $WHEEL"; exit 1 ;;
          esac
          twine check "${WHEELS[0]}"
          {
            echo "wheel=$WHEEL"
            echo "sha256=$(sha256sum "${WHEELS[0]}" | cut -d' ' -f1)"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke-install in a clean venv
        run: |
          set -euo pipefail
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "${WHEELS[0]}"
          /tmp/smoke/bin/python -c "import amplitude_experiment"
          /tmp/smoke/bin/pip show amplitude-experiment | grep '^Version:'

      # These four integration suites require live Amplitude services and/or
      # credentials. The remaining suite is the repository's hermetic release
      # gate; integration coverage stays in the existing Unit Test workflow.
      - name: Run package tests
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-dev.txt
          rm \
            tests/evaluation/evaluation_integration_test.py \
            tests/local/client_test.py \
            tests/local/client_eu_test.py \
            tests/remote/client_test.py
          python -m unittest discover -s ./tests -p '*_test.py'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 5

  upload:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wheels-release
    permissions:
      id-token: write
      contents: read
    env:
      PKG_DIR: amplitude-experiment
      TAG: ${{ needs.build-and-test.outputs.tag }}
      WHEEL: ${{ needs.build-and-test.outputs.wheel }}
      SHA256: ${{ needs.build-and-test.outputs.sha256 }}
      COMMIT: ${{ needs.build-and-test.outputs.commit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel
          path: dist

      - name: Verify artifact and upload configuration
        env:
          ROLE_ARN: ${{ vars.WHEELS_UPLOAD_ROLE_ARN }}
          AWS_REGION: ${{ vars.WHEELS_AWS_REGION }}
          WHEELS_BUCKET: ${{ vars.WHEELS_BUCKET }}
          WHEELS_BASE_URL: ${{ vars.WHEELS_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "${ROLE_ARN:-}" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || {
            echo "::error::WHEELS_UPLOAD_ROLE_ARN is missing or invalid"
            exit 1
          }
          [[ "${AWS_REGION:-}" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]] || {
            echo "::error::WHEELS_AWS_REGION is missing or invalid"
            exit 1
          }
          [[ "${WHEELS_BASE_URL:-}" =~ ^https://[A-Za-z0-9.-]+$ ]] || {
            echo "::error::WHEELS_BASE_URL must be an HTTPS scheme+host with no path or trailing slash"
            exit 1
          }
          [[ "${WHEELS_BUCKET:-}" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            echo "::error::WHEELS_BUCKET must be a 3-63 character DNS bucket name without dots"
            exit 1
          }
          echo "${SHA256}  dist/${WHEEL}" | sha256sum -c -

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.WHEELS_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.WHEELS_AWS_REGION }}
          role-session-name: wheels-${{ github.run_id }}

      - name: Upload to S3 atomically
        env:
          WHEELS_BUCKET: ${{ vars.WHEELS_BUCKET }}
          WHEELS_BASE_URL: ${{ vars.WHEELS_BASE_URL }}
        run: |
          set -euo pipefail
          KEY="wheels/${PKG_DIR}/${TAG}/${WHEEL}"
          aws s3api put-object --bucket "$WHEELS_BUCKET" --key "$KEY" \
            --body "dist/${WHEEL}" --if-none-match '*'
          PKG_NAME="${WHEEL%%-*}"
          PKG_NAME="${PKG_NAME//_/-}"
          {
            echo "### Wheel published (source commit ${COMMIT})"
            echo '```'
            echo "${PKG_NAME} @ ${WHEELS_BASE_URL}/${KEY}#sha256=${SHA256}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
